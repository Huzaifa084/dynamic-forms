server:
  port: 8085

spring:
  application:
    name: PayRoll

  datasource:
    url: jdbc:postgresql://localhost:5436/demo
    username: postgres
    password: test
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  jackson:
    property-naming-strategy: SNAKE_CASE

  data:
    redis:
      host: localhost
      port: 6388

jwt:
  secret: "MCsAzvFBHnAv0CWIZonhazMPmT2kkrTSQ8JOVHSRnI8Xo8hdrnRcTQkI6ux3JNJx"
  encryption-secret: "e1n5j0Gbc1bFRzf9dkyD4KZONmh8ONjUzwdGe8gMn-6EqPshH4YSKxzUYuNqjIpn"
  access-ttl: "P30D"
  refresh-ttl: "P30D"
  pre-auth-ttl: "PT5M"
  password-reset-ttl: "PT15M"
  issuer: "GuardCall"
  min-secret-key-length: 64

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.apex.payroll: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"